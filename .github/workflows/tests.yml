name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Pint & PHPStan
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  tests:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} ${{ matrix.dependencies == 'lowest' && '(lowest)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        exclude:
          # Laravel 13 requires PHP 8.3+
          - php: '8.2'
            laravel: '13'
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
          - php: '8.4'
            laravel: '13'
            testbench: '11'
            coverage: true
          - php: '8.2'
            laravel: '12'
            testbench: '10'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}

      - name: Require Laravel ${{ matrix.laravel }}
        run: |
          composer require --no-update --no-interaction "illuminate/contracts:^${{ matrix.laravel }}.0" "illuminate/http:^${{ matrix.laravel }}.0" "illuminate/support:^${{ matrix.laravel }}.0"
          composer require --no-update --no-interaction --dev "orchestra/testbench:^${{ matrix.testbench }}.0"

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies || 'highest' }}

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: vendor/bin/pest --compact

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: vendor/bin/pest --coverage --min=100
